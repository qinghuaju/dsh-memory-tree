name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: engine tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Offline engine suite (AST, SQLite, recall, tiering, recovery)
        run: node scripts/selftest.mjs
      - name: Syntax check
        run: |
          node --check src/plugin.mjs
          node --check src/engine/engine.mjs
          node --check scripts/install.mjs
          node --check src/dsh/engine-host.mjs
          node --check scripts/market-index.mjs
      - name: Secret scan
        run: node scripts/check-secrets.mjs
      - name: Bundle patch present
        run: test -f cordis.patch.yml
      - name: Market index (optional)
        run: node scripts/check-market.mjs

  # The plugin dry-run needs the DSH runtime packages (@deepseek-ai/dsh-tools,
  # dsh-llm, schemastery), which are not published in a compatible version yet.
  # Run it on a machine with DSH installed: `node scripts/dryrun-plugin.mjs`.
