name: Bug report
description: Something is broken or memory does not behave as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please include the `mem_stats` output — it answers most
        environment questions at once (tier sizes, model, pending documents).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. installed with ...
        2. chatted two turns
        3. asked ...
    validations:
      required: true
  - type: textarea
    id: stats
    attributes:
      label: mem_stats output
      description: Ask the agent to call `mem_stats`, or run `node scripts/demo.mjs stats`
      render: text
  - type: input
    id: version
    attributes:
      label: dsh-memory-tree version / commit
    validations:
      required: true
  - type: input
    id: dsh
    attributes:
      label: DSH version and OS
      placeholder: DSH 0.1.x on Windows 11 / macOS 15
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Plugin warnings appear in the DSH log; remove any secrets first.
      render: text
